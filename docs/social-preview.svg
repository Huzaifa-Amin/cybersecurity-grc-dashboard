      <stop offset="0" stop-color="#142b49"/>
      <stop offset=".62" stop-color="#203f64"/>
      <stop offset="1" stop-color="#087e8b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73dbd2"/>
      <stop offset="1" stop-color="#b0f0d1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="26" fill="#eef4f8"/>
  <rect x="22" y="22" width="1156" height="586" rx="23" fill="url(#background)"/>
  <circle cx="1085" cy="85" r="190" fill="#fff" fill-opacity=".035"/>
