<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Cybersecurity GRC Workspace</title>
  <desc id="desc">Northstar is a role-based governance, risk, and compliance workspace for shared controls, risk prioritization, evidence references, and auditability.</desc>
