  <text x="98" y="423" fill="#9ce1d9" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">ACCESS</text>
  <text x="98" y="454" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Least privilege</text>
  <text x="362" y="423" fill="#9ce1d9" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">OPERATIONS</text>
