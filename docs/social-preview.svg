  <text x="626" y="423" fill="#9ce1d9" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">ASSURANCE</text>
  <text x="626" y="454" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Risk &amp; evidence</text>
