  <text x="145" y="93" fill="#e7f5f8" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">NORTHSTAR · CYBER GRC</text>
  <text x="76" y="216" fill="#fff" font-family="Arial,sans-serif" font-size="51" font-weight="700">Governance, risk,</text>
  <text x="76" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="51" font-weight="700">and controls in view.</text>
  <text x="80" y="328" fill="#d7e7f0" font-family="Arial,sans-serif" font-size="20">A persistent, role-aware GRC workspace for one organization.</text>
